# Throwaway actual-server for integration tests and spikes. Local only, never deployed.
# Pinned tag matches the installed @actual-app/api version (26.11.0). Production servers
# (R5, R4-Padres) were on 26.10.0 as of 2026-10-08; bump them before relying on 26.11 behaviour there.
services:
  actual:
    image: actualbudget/actual-server:26.11.0
    ports:
      - "5006:5006"
    tmpfs:
      - /data          # ephemeral: wiped on container removal
